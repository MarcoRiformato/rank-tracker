<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Detail - Rank Tracker</title>
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enable dark mode by default
        document.documentElement.classList.add('dark');
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        .card {
            background: #1e293b;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .metric-card.green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .metric-card.yellow {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge.gold { background: #FFD700; color: #000; }
        .badge.green { background: #22c55e; color: white; }
        .badge.yellow { background: #eab308; color: #000; }
        .badge.orange { background: #f97316; color: white; }
        .badge.red { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container mx-auto px-3 py-4 max-w-7xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <div>
                <a href="/dashboard" class="text-blue-400 hover:text-blue-300 text-xs mb-1 inline-block">← Back to Dashboard</a>
                <h1 class="text-xl font-bold text-white mb-1">📍 Point Detail</h1>
                <p class="text-sm text-slate-400" id="pointLocation">Loading...</p>
            </div>
        </div>
        
        <!-- Current Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
            <div class="metric-card" style="padding: 12px; border-radius: 8px;">
                <div class="text-xs opacity-90 mb-1">Current Local Pack Rank</div>
                <div class="text-2xl font-bold" id="currentLocalPack">—</div>
            </div>
            <div class="metric-card green" style="padding: 12px; border-radius: 8px;">
                <div class="text-xs opacity-90 mb-1">Current Organic Rank</div>
                <div class="text-2xl font-bold" id="currentOrganic">—</div>
            </div>
            <div class="metric-card yellow" style="padding: 12px; border-radius: 8px;">
                <div class="text-xs opacity-90 mb-1">Best Rank Achieved</div>
                <div class="text-2xl font-bold" id="bestRank">—</div>
            </div>
        </div>
        
        <!-- Charts Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div class="card">
                <h3 class="text-sm font-semibold mb-3 text-slate-300">Ranking History Timeline</h3>
                <canvas id="historyChart" style="max-height: 250px;"></canvas>
            </div>
            <div class="card">
                <h3 class="text-sm font-semibold mb-3 text-slate-300">Rank Distribution Over Time</h3>
                <canvas id="distributionChart" style="max-height: 250px;"></canvas>
            </div>
        </div>
        
        <!-- Additional Info -->
        <div class="card">
            <h3 class="text-sm font-semibold mb-3 text-slate-300">All Scan History</h3>
            <div class="overflow-x-auto">
                <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                    <thead>
                        <tr style="background: #334155; border-bottom: 2px solid #475569;">
                            <th style="padding: 8px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; color: #94a3b8;">Date</th>
                            <th style="padding: 8px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; color: #94a3b8;">Local Pack</th>
                            <th style="padding: 8px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; color: #94a3b8;">Organic</th>
                            <th style="padding: 8px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; color: #94a3b8;">Display Rank</th>
                            <th style="padding: 8px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; color: #94a3b8;">Matched Business</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Get point parameters from URL
        const params = window.location.pathname.split('/');
        const lat = parseFloat(params[2]);
        const lon = parseFloat(params[3]);
        const keyword = decodeURIComponent(params[4] || '');
        
        // Load point detail data
        async function loadPointDetail() {
            try {
                // Update location
                document.getElementById('pointLocation').textContent = `Location: ${lat.toFixed(6)}, ${lon.toFixed(6)} | Keyword: ${keyword}`;
                
                // Load history
                const response = await fetch(`/api/point-history?lat=${lat}&lon=${lon}&keyword=${encodeURIComponent(keyword)}`);
                const data = await response.json();
                const history = data.history || [];
                
                if (history.length === 0) {
                    document.getElementById('historyTableBody').innerHTML = '<tr><td colspan="5" style="padding: 16px; text-align: center; color: #94a3b8; font-size: 12px;">No history data available</td></tr>';
                    return;
                }
                
                // Get latest (current) status
                const latest = history[history.length - 1];
                document.getElementById('currentLocalPack').textContent = latest.local_pack_rank || 'Not Found';
                document.getElementById('currentOrganic').textContent = latest.organic_rank || 'Not Found';
                
                // Find best rank
                let bestRank = null;
                history.forEach(h => {
                    if (h.display_rank && (bestRank === null || h.display_rank < bestRank)) {
                        bestRank = h.display_rank;
                    }
                });
                document.getElementById('bestRank').textContent = bestRank ? `#${bestRank}` : '—';
                
                // Render history table
                const tbody = document.getElementById('historyTableBody');
                tbody.innerHTML = '';
                history.reverse().forEach(h => {
                    const row = document.createElement('tr');
                    const date = new Date(h.date);
                    const localPackBadge = getRankBadge(h.local_pack_rank);
                    const organicBadge = getRankBadge(h.organic_rank);
                    const displayBadge = getRankBadge(h.display_rank);
                    
                    row.innerHTML = `
                        <td style="padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1;">${date.toLocaleString()}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1;">${localPackBadge}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1;">${organicBadge}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1;">${displayBadge}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #334155; color: #cbd5e1;">${escapeHtml(h.matched_business_name || '—')}</td>
                    `;
                    tbody.appendChild(row);
                });
                
                // Render charts
                renderHistoryChart(history);
                renderDistributionChart(history);
                
            } catch (error) {
                console.error('Error loading point detail:', error);
            }
        }
        
        function renderHistoryChart(history) {
            const ctx = document.getElementById('historyChart');
            if (!ctx) return;
            
            const labels = history.map(h => {
                const date = new Date(h.date);
                return date.toLocaleDateString();
            }).reverse();
            
            const localPackData = history.map(h => h.local_pack_rank).reverse();
            const organicData = history.map(h => h.organic_rank).reverse();
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Local Pack',
                            data: localPackData,
                            borderColor: '#FFD700',
                            backgroundColor: 'rgba(255, 215, 0, 0.1)',
                            tension: 0.4,
                            spanGaps: true
                        },
                        {
                            label: 'Organic',
                            data: organicData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            spanGaps: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            reverse: true,
                            title: {
                                display: true,
                                text: 'Rank'
                            }
                        }
                    }
                }
            });
        }
        
        function renderDistributionChart(history) {
            const ctx = document.getElementById('distributionChart');
            if (!ctx) return;
            
            // Count rank ranges
            const distribution = {
                '1-3': 0,
                '4-10': 0,
                '11-20': 0,
                '21-30': 0,
                'Not Found': 0
            };
            
            history.forEach(h => {
                const rank = h.display_rank;
                if (!rank) {
                    distribution['Not Found']++;
                } else if (rank <= 3) {
                    distribution['1-3']++;
                } else if (rank <= 10) {
                    distribution['4-10']++;
                } else if (rank <= 20) {
                    distribution['11-20']++;
                } else if (rank <= 30) {
                    distribution['21-30']++;
                } else {
                    distribution['Not Found']++;
                }
            });
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Rank 1-3', 'Rank 4-10', 'Rank 11-20', 'Rank 21-30', 'Not Found'],
                    datasets: [{
                        label: 'Occurrences',
                        data: [
                            distribution['1-3'],
                            distribution['4-10'],
                            distribution['11-20'],
                            distribution['21-30'],
                            distribution['Not Found']
                        ],
                        backgroundColor: ['#FFD700', '#22c55e', '#eab308', '#f97316', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        function getRankBadge(rank) {
            if (rank === null || rank === undefined) {
                return '<span class="badge red">Not Found</span>';
            }
            if (rank >= 1 && rank <= 3) {
                return `<span class="badge gold">${rank}</span>`;
            } else if (rank >= 4 && rank <= 10) {
                return `<span class="badge green">${rank}</span>`;
            } else if (rank >= 11 && rank <= 20) {
                return `<span class="badge yellow">${rank}</span>`;
            } else if (rank >= 21 && rank <= 30) {
                return `<span class="badge orange">${rank}</span>`;
            } else {
                return `<span class="badge red">${rank}</span>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load on page load
        loadPointDetail();
    </script>
</body>
</html>
